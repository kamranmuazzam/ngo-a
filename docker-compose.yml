version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
      - ai_agent

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - DB_URL=surrealdb:8000
    depends_on:
      - surrealdb

  surrealdb:
    image: surrealdb/surrealdb:latest
    ports:
      - "8000:8000"
    command: start --log trace --user root --pass root file:/data/database.db
    volumes:
      - ./surreal_data:/data

  ai_agent:
    build: ./ai_agent
    ports:
      - "8001:8001"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./reports_out:/app/reports_out
